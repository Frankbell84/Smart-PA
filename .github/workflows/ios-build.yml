name: KeyHollow iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Reproduce the TestFlight compatibility boundary: compile with an
      # iOS 26 SDK, then launch on an installed iOS 18 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release hygiene
        run: python3 scripts/check_release_hygiene.py

      - name: Verify architecture boundaries
        run: python3 scripts/check_architecture_boundaries.py

      - name: Test TestFlight build-number guard
        run: node scripts/verify_testflight_build_number.mjs --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iOS Simulator
        run: |
          set -euo pipefail

          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in payload.get("devices", {}).items()
              if runtime.endswith(".iOS-18-5")
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(devices[0]["udid"] if devices else "")
          ')

          if [[ -z "$SIMULATOR_ID" ]]; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
            import json, sys
            runtimes = [
                runtime
                for runtime in json.load(sys.stdin).get("runtimes", [])
                if runtime.get("isAvailable")
                and runtime.get("identifier", "").endswith(".iOS-18-5")
            ]
            print(runtimes[-1]["identifier"] if runtimes else "")
            ')
            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
            import json, sys
            device_types = [
                device_type
                for device_type in json.load(sys.stdin).get("devicetypes", [])
                if device_type.get("name", "").startswith("iPhone")
            ]
            print(device_types[0]["identifier"] if device_types else "")
            ')

            if [[ -z "$RUNTIME_ID" || -z "$DEVICE_TYPE_ID" ]]; then
              echo "No usable iOS Simulator runtime or iPhone device type is installed."
              exit 1
            fi

            SIMULATOR_ID=$(xcrun simctl create "KeyHollow CI iPhone" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          fi

          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged thumbnail asset
        run: |
          set -euo pipefail
          EXTENSION_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/KeyHollow.app/PlugIns/KeyHollowVaultThumbnail.appex"
          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/Assets.car"

      - name: Run security unit tests
        run: |
          set -o pipefail
          rm -rf build/KeyHollowTests.xcresult
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/KeyHollowTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator build
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: KeyHollow-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/KeyHollow.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: KeyHollow-Security-Tests
          path: build/KeyHollowTests.xcresult
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL (Swift)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/CodeQLDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze Swift with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:swift
