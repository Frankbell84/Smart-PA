name: KeyHollow iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Reproduce the TestFlight compatibility boundary: compile with an
      # iOS 26 SDK, then launch on an installed iOS 18 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iOS Simulator
        run: |
          set -euo pipefail

          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in payload.get("devices", {}).items()
              if runtime.endswith(".iOS-18-5")
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(devices[0]["udid"] if devices else "")
          ')

          if [[ -z "$SIMULATOR_ID" ]]; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
            import json, sys
            runtimes = [
                runtime
                for runtime in json.load(sys.stdin).get("runtimes", [])
                if runtime.get("isAvailable")
                and runtime.get("identifier", "").endswith(".iOS-18-5")
            ]
            print(runtimes[-1]["identifier"] if runtimes else "")
            ')
            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
            import json, sys
            device_types = [
                device_type
                for device_type in json.load(sys.stdin).get("devicetypes", [])
                if device_type.get("name", "").startswith("iPhone")
            ]
            print(device_types[0]["identifier"] if device_types else "")
            ')

            if [[ -z "$RUNTIME_ID" || -z "$DEVICE_TYPE_ID" ]]; then
              echo "No usable iOS Simulator runtime or iPhone device type is installed."
              exit 1
            fi

            SIMULATOR_ID=$(xcrun simctl create "KeyHollow CI iPhone" "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          fi

          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run security unit tests
        run: |
          set -o pipefail
          rm -rf build/KeyHollowTests.xcresult
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/KeyHollowTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyHollow-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/KeyHollow.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyHollow-Security-Tests
          path: build/KeyHollowTests.xcresult
          if-no-files-found: warn
          retention-days: 30
