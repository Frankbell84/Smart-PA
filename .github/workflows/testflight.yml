name: Upload KeyHollow to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number confirmed against App Store Connect
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive-and-upload:
    # Production delivery may run from main or the exact isolated candidate
    # branch after its review gates pass. No other feature branch can upload.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/delivery/khvault-thumbnail-extension'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: P38X56QHU9

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release hygiene
        run: python3 scripts/check_release_hygiene.py

      - name: Verify production identity
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:[[:space:]]*com\.keyhollow\.app[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*CFBundleDisplayName:[[:space:]]*KeyHollow[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*MARKETING_VERSION:[[:space:]]*1\.0[[:space:]]*$' project.yml
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:[[:space:]]*com\.keyhollow\.app\.vault-thumbnail[[:space:]]*$' project.yml

          PROJECT_BUILDS=$(awk -F: '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { gsub(/[[:space:]]/, "", $2); print $2 }' project.yml | sort -u)
          if [[ "$PROJECT_BUILDS" != "$REQUESTED_BUILD_NUMBER" ]]; then
            echo "Requested Build $REQUESTED_BUILD_NUMBER does not match every product build:"
            printf '%s\n' "$PROJECT_BUILDS"
            exit 1
          fi

      - name: Verify build number against App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_APP_ID: 6807022780
        run: node scripts/verify_testflight_build_number.mjs "${{ inputs.build_number }}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install cloud-signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          THUMBNAIL_PROVISION_PROFILE_BASE64: ${{ secrets.THUMBNAIL_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/keyhollow-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/keyhollow-signing.keychain-db"
          APP_PROFILE_PATH="$RUNNER_TEMP/keyhollow-app.mobileprovision"
          THUMBNAIL_PROFILE_PATH="$RUNNER_TEMP/keyhollow-thumbnail.mobileprovision"
          APP_PROFILE_PLIST="$RUNNER_TEMP/keyhollow-app-profile.plist"
          THUMBNAIL_PROFILE_PLIST="$RUNNER_TEMP/keyhollow-thumbnail-profile.plist"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$THUMBNAIL_PROVISION_PROFILE_BASE64" | base64 --decode > "$THUMBNAIL_PROFILE_PATH"
          security cms -D -i "$APP_PROFILE_PATH" > "$APP_PROFILE_PLIST"
          security cms -D -i "$THUMBNAIL_PROFILE_PATH" > "$THUMBNAIL_PROFILE_PLIST"
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$APP_PROFILE_PLIST")
          THUMBNAIL_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$THUMBNAIL_PROFILE_PLIST")
          cp "$APP_PROFILE_PATH" "$PROFILE_DIRECTORY/$APP_PROFILE_UUID.mobileprovision"
          cp "$THUMBNAIL_PROFILE_PATH" "$PROFILE_DIRECTORY/$THUMBNAIL_PROFILE_UUID.mobileprovision"
          echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "THUMBNAIL_PROFILE_UUID=$THUMBNAIL_PROFILE_UUID" >> "$GITHUB_ENV"

          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive KeyHollow
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyHollow.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived build and module hygiene
        run: |
          set -euo pipefail

          APP_PATH='build/KeyHollow.xcarchive/Products/Applications/KeyHollow.app'
          ARCHIVED_INFO="$APP_PATH/Info.plist"
          EXTENSION_PATH="$APP_PATH/PlugIns/KeyHollowVaultThumbnail.appex"
          EXTENSION_INFO="$EXTENSION_PATH/Info.plist"
          ARCHIVED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVED_INFO")
          EXPECTED_BUILD=$(xcodebuild -project KeyHollow.xcodeproj -scheme KeyHollow -configuration Release -showBuildSettings | awk '/ CURRENT_PROJECT_VERSION = / { print $3; exit }')

          if [[ "$ARCHIVED_BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "Archived build number $ARCHIVED_BUILD does not match project build number $EXPECTED_BUILD."
            exit 1
          fi

          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXTENSION_INFO")" = \
            'com.keyhollow.app.vault-thumbnail'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXTENSION_INFO")" = \
            'com.apple.quicklook.thumbnail'

          if find "$APP_PATH" -name 'KHVaultDocumentIcon-*.png' -print -quit | grep -q .; then
            echo 'Legacy document icon PNGs entered the archive.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c \
            'Print :CFBundleDocumentTypes:0:CFBundleTypeIconFiles' "$ARCHIVED_INFO" >/dev/null 2>&1; then
            echo 'Legacy CFBundleTypeIconFiles metadata entered the archive.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c \
            'Print :UTExportedTypeDeclarations:0:UTTypeIcons' "$ARCHIVED_INFO" >/dev/null 2>&1; then
            echo 'Abandoned UTTypeIcons metadata entered the archive.'
            exit 1
          fi

          echo "Verified clean Build $ARCHIVED_BUILD with isolated thumbnail extension."

      - name: Create export options
        run: |
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.keyhollow.app string KeyHollow App Store' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.keyhollow.app.vault-thumbnail string KeyHollow Vault Thumbnail App Store' build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' build/ExportOptions.plist

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/KeyHollow.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
          if [[ -z "$IPA_PATH" ]]; then
            echo 'No IPA was produced.'
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload signed IPA artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: KeyHollow-TestFlight-IPA
          path: build/export/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail

          security delete-keychain "$RUNNER_TEMP/keyhollow-signing.keychain-db" || true
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -f \
            "$RUNNER_TEMP/keyhollow-distribution.p12" \
            "$RUNNER_TEMP/keyhollow-app.mobileprovision" \
            "$RUNNER_TEMP/keyhollow-thumbnail.mobileprovision" \
            "$RUNNER_TEMP/keyhollow-app-profile.plist" \
            "$RUNNER_TEMP/keyhollow-thumbnail-profile.plist" \
            "$PROFILE_DIRECTORY/${APP_PROFILE_UUID:-}.mobileprovision" \
            "$PROFILE_DIRECTORY/${THUMBNAIL_PROFILE_UUID:-}.mobileprovision" \
            "$APP_STORE_CONNECT_API_KEY_PATH"

          if [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
