name: Upload KeyHollow Beta to TestFlight

on:
  push:
    branches:
      - delivery/v2-beta

permissions:
  contents: read

jobs:
  archive-and-upload-beta:
    if: github.ref == 'refs/heads/delivery/v2-beta'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: P38X56QHU9
      BUNDLE_ID: com.keyhollow.app.beta
      PROFILE_NAME: KeyHollow Beta App Store

    steps:
      - name: Checkout isolated beta
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify beta isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/delivery/v2-beta'
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app.beta' project.yml
          grep -q 'CFBundleDisplayName: KeyHollow Beta' project.yml
          grep -q 'MARKETING_VERSION: 2.0' project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install beta signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BETA_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BETA_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/keyhollow-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/keyhollow-beta-app-store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/keyhollow-beta-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BETA_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/KeyHollow-Beta-App-Store.mobileprovision"

      - name: Archive KeyHollow Beta
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyHollow.xcodeproj \
            -scheme KeyHollow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyHollow-Beta.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Verify archived beta identity
        run: |
          set -euo pipefail

          ARCHIVED_INFO='build/KeyHollow-Beta.xcarchive/Products/Applications/KeyHollow.app/Info.plist'
          ARCHIVED_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ARCHIVED_INFO")
          ARCHIVED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$ARCHIVED_INFO")
          ARCHIVED_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVED_INFO")

          test "$ARCHIVED_BUNDLE_ID" = "$BUNDLE_ID"
          test "$ARCHIVED_NAME" = 'KeyHollow Beta'
          test "$ARCHIVED_VERSION" = '2.0'

      - name: Create beta export options
        run: |
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' build/BetaExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' build/BetaExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/BetaExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' build/BetaExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' build/BetaExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" build/BetaExportOptions.plist

      - name: Export signed beta IPA
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/KeyHollow-Beta.xcarchive \
            -exportPath build/beta-export \
            -exportOptionsPlist build/BetaExportOptions.plist

      - name: Upload beta to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          IPA_PATH=$(find build/beta-export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload signed beta IPA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KeyHollow-Beta-TestFlight-IPA
          path: build/beta-export/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary beta signing material
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail

          security delete-keychain "$RUNNER_TEMP/keyhollow-beta-signing.keychain-db" || true
          rm -f \
            "$RUNNER_TEMP/keyhollow-distribution.p12" \
            "$RUNNER_TEMP/keyhollow-beta-app-store.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/KeyHollow-Beta-App-Store.mobileprovision"

          if [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
