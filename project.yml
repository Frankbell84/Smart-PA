name: KeyHollow
options:
  bundleIdPrefix: com.keyhollow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Argon2idSwiftNative:
    url: https://github.com/MarlonJD/argon2id-swift-native.git
    exactVersion: 0.1.1

targets:
  KeyHollow:
    type: application
    platform: iOS
    sources:
      - path: KeyHollow
    dependencies:
      - package: Argon2idSwiftNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app
        PRODUCT_NAME: KeyHollow
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: KeyHollow/Resources/Info.plist
      properties:
        CFBundleDisplayName: KeyHollow
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: KeyHollow needs access only to photos you choose to copy or move into an encrypted vault.
        NSPhotoLibraryAddUsageDescription: KeyHollow may need Photos access to complete user-requested photo operations.
        ITSAppUsesNonExemptEncryption: false
