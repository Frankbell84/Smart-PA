name: KeyHollow
options:
  bundleIdPrefix: com.keyhollow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  KeyHollowCryptoCore:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/Security/CryptoBox.swift
      - path: KeyHollow/ThirdParty/Argon2id
    settings:
      base:
        PRODUCT_NAME: KeyHollowCryptoCore
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollowVaultCore:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/Security/KeyDerivation.swift
      - path: KeyHollow/Security/PasscodePolicy.swift
      - path: KeyHollow/Security/VaultEnvelope.swift
      - path: KeyHollow/Security/VaultLocator.swift
      - path: KeyHollow/Storage/VaultStore.swift
    dependencies:
      - target: KeyHollowCryptoCore
    settings:
      base:
        PRODUCT_NAME: KeyHollowVaultCore
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollowPhotoCore:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/Photos/VaultPhotoCryptographicAccess.swift
      - path: KeyHollow/Photos/VaultPhotoModels.swift
      - path: KeyHollow/Photos/VaultPhotoStore.swift
    dependencies:
      - target: KeyHollowCryptoCore
    settings:
      base:
        PRODUCT_NAME: KeyHollowPhotoCore
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollowPhotosAdapter:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/Photos/PhotoLibraryAdapter.swift
    settings:
      base:
        PRODUCT_NAME: KeyHollowPhotosAdapter
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollowTransferCore:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/Transfer/PortableArchiveContainer.swift
      - path: KeyHollow/Transfer/PortableArchiveSecurity.swift
      - path: KeyHollow/Transfer/PortableArchivePayload.swift
      - path: KeyHollow/Transfer/PortableVaultRestoreTransactionJournal.swift
      - path: KeyHollow/Transfer/EncryptedVaultTransferCoordinator.swift
    dependencies:
      - target: KeyHollowCryptoCore
      - target: KeyHollowPhotoCore
      - target: KeyHollowVaultCore
    settings:
      base:
        PRODUCT_NAME: KeyHollowTransferCore
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollowFileRecognitionAddOn:
    type: library.static
    platform: iOS
    sources:
      - path: KeyHollow/AddOns/FileRecognition
    settings:
      base:
        PRODUCT_NAME: KeyHollowFileRecognitionAddOn
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  KeyHollow:
    type: application
    platform: iOS
    sources:
      - path: KeyHollow
        excludes:
          - AddOns/FileRecognition
          - Security/CryptoBox.swift
          - Security/KeyDerivation.swift
          - Security/PasscodePolicy.swift
          - Security/VaultEnvelope.swift
          - Security/VaultLocator.swift
          - Photos/VaultPhotoCryptographicAccess.swift
          - Photos/VaultPhotoModels.swift
          - Photos/VaultPhotoStore.swift
          - Photos/PhotoLibraryAdapter.swift
          - Storage/VaultStore.swift
          - Transfer/PortableArchiveContainer.swift
          - Transfer/PortableArchiveSecurity.swift
          - Transfer/PortableArchivePayload.swift
          - Transfer/PortableVaultRestoreTransactionJournal.swift
          - Transfer/EncryptedVaultTransferCoordinator.swift
          - ThirdParty/Argon2id
    dependencies:
      - target: KeyHollowFileRecognitionAddOn
      - target: KeyHollowCryptoCore
      - target: KeyHollowPhotoCore
      - target: KeyHollowPhotosAdapter
      - target: KeyHollowTransferCore
      - target: KeyHollowVaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app
        PRODUCT_NAME: KeyHollow
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 13
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: KeyHollow/Resources/Info.plist
      properties:
        CFBundleDisplayName: KeyHollow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: KeyHollow needs access only to photos you choose to copy or move into an encrypted vault.
        NSPhotoLibraryAddUsageDescription: KeyHollow needs permission to save photos you choose from an encrypted vault back to your Photos library.
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.keyhollow.encrypted-vault
            UTTypeDescription: KeyHollow Encrypted Vault
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - khvault
              public.mime-type: application/vnd.keyhollow.khvault
        CFBundleDocumentTypes:
          - CFBundleTypeName: KeyHollow Encrypted Vault
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.keyhollow.encrypted-vault

  KeyHollowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyHollowTests
    dependencies:
      - target: KeyHollow
      - target: KeyHollowFileRecognitionAddOn
        link: false
      - target: KeyHollowCryptoCore
        link: false
      - target: KeyHollowPhotoCore
        link: false
      - target: KeyHollowPhotosAdapter
        link: false
      - target: KeyHollowTransferCore
        link: false
      - target: KeyHollowVaultCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app.tests
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete

  KeyHollowLaunchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyHollowLaunchTests
    dependencies:
      - target: KeyHollow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app.launch-tests
        SWIFT_VERSION: 5.0

schemes:
  KeyHollow:
    build:
      targets:
        KeyHollowFileRecognitionAddOn: all
        KeyHollowCryptoCore: all
        KeyHollowPhotoCore: all
        KeyHollowPhotosAdapter: all
        KeyHollowTransferCore: all
        KeyHollowVaultCore: all
        KeyHollow: all
        KeyHollowTests: [test]
    test:
      config: Debug
      targets:
        - KeyHollowTests
        - KeyHollowLaunchTests
    archive:
      config: Release


