name: NoxLock
options:
  bundleIdPrefix: com.noxlock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    exactVersion: 1.0.4

targets:
  NoxLock:
    type: application
    platform: iOS
    sources:
      - path: NoxLock
    dependencies:
      - package: Argon2Swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxlock.app
        PRODUCT_NAME: NoxLock
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: NoxLock/Resources/Info.plist
      properties:
        CFBundleDisplayName: NoxLock
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: NoxLock needs access only to photos you choose to copy or move into an encrypted vault.
        NSPhotoLibraryAddUsageDescription: NoxLock may need Photos access to complete user-requested photo operations.
        ITSAppUsesNonExemptEncryption: false
