name: KeyHollow
options:
  bundleIdPrefix: com.keyhollow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  KeyHollow:
    type: application
    platform: iOS
    sources:
      - path: KeyHollow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app
        PRODUCT_NAME: KeyHollow
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 4
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: KeyHollow/Resources/Info.plist
      properties:
        CFBundleDisplayName: KeyHollow
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: KeyHollow needs access only to photos you choose to copy or move into an encrypted vault.
        NSPhotoLibraryAddUsageDescription: KeyHollow needs permission to save photos you choose from an encrypted vault back to your Photos library.
        ITSAppUsesNonExemptEncryption: false

  KeyHollowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyHollowTests
    dependencies:
      - target: KeyHollow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app.tests
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete

  KeyHollowLaunchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KeyHollowLaunchTests
    dependencies:
      - target: KeyHollow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keyhollow.app.launch-tests
        SWIFT_VERSION: 5.0

schemes:
  KeyHollow:
    build:
      targets:
        KeyHollow: all
        KeyHollowTests: [test]
    test:
      config: Debug
      targets:
        - KeyHollowTests
        - KeyHollowLaunchTests
    archive:
      config: Release

